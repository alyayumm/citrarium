<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Автошкола Цитрариум</title>
    <script>
      const basePath = '/citrarium';
      const nextPath = location.pathname.startsWith(basePath)
        ? location.pathname.slice(basePath.length) || '/'
        : location.pathname;

      sessionStorage.redirect = nextPath + location.search + location.hash;
      location.replace(basePath + '/');
    </script>
  </head>
  <body>
    <a href="/citrarium/">Вернуться на главную автошколы «Цитрариум»</a>
  </body>
</html>
